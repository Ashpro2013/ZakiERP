<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Modern Gradient Palettes -->
    <linearGradient id="gradCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="gradIndigoPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="gradEmeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="gradAmberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="gradWhiteGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Outer Hexagonal Tech Lattice (Safe Zone Centered) -->
    <polygon points="256,90 376,160 376,300 256,370 136,300 136,160" 
             fill="none" 
             stroke="url(#gradCyanBlue)" 
             stroke-width="10" 
             stroke-linejoin="round" 
             opacity="0.9" />

    <!-- Network Nodes on Hexagon Vertices -->
    <circle cx="256" cy="90" r="8" fill="#38BDF8" filter="url(#nodeGlow)" />
    <circle cx="376" cy="160" r="8" fill="#6366F1" />
    <circle cx="376" cy="300" r="8" fill="#A855F7" />
    <circle cx="256" cy="370" r="8" fill="#10B981" filter="url(#nodeGlow)" />
    <circle cx="136" cy="300" r="8" fill="#06B6D4" />
    <circle cx="136" cy="160" r="8" fill="#38BDF8" />

    <!-- Inner Shield Backdrop Glow -->
    <polygon points="256,112 356,170 356,290 256,348 156,290 156,170" 
             fill="#1E293B" 
             opacity="0.6" />

    <!-- Left Leg of 3D 'A' Emblem -->
    <path d="M 256 128 L 172 292 H 210 L 234 242 H 278 L 256 128 Z" 
          fill="url(#gradCyanBlue)" />

    <!-- Right Leg & Facet of 'A' (Depth Shadow Layer) -->
    <path d="M 256 128 L 278 242 H 302 L 340 292 H 302 L 256 128 Z" 
          fill="url(#gradIndigoPurple)" />

    <!-- Inner 'A' Triangle Cutout -->
    <polygon points="256,165 240,225 272,225" fill="#0F172A" />

    <!-- ERP Growth Chart Bars / Cross Bridge -->
    <!-- Bar 1 -->
    <rect x="210" y="246" width="14" height="38" rx="4" fill="url(#gradEmeraldCyan)" />
    <!-- Bar 2 -->
    <rect x="230" y="234" width="14" height="50" rx="4" fill="url(#gradCyanBlue)" />
    <!-- Bar 3 -->
    <rect x="250" y="220" width="14" height="64" rx="4" fill="url(#gradWhiteGlow)" />
    <!-- Bar 4 -->
    <rect x="270" y="230" width="14" height="54" rx="4" fill="url(#gradIndigoPurple)" />
    <!-- Bar 5 -->
    <rect x="290" y="244" width="14" height="40" rx="4" fill="url(#gradAmberGold)" />

    <!-- Upward Trend Growth Arrow Overlay -->
    <path d="M 200 286 L 256 226 L 312 286 L 298 296 L 256 250 L 214 296 Z" 
          fill="#FFFFFF" 
          filter="url(#nodeGlow)" />

    <!-- Center ERP Diamond Core -->
    <polygon points="256,196 268,212 256,228 244,212" fill="url(#gradAmberGold)" />
  </g>
</svg>