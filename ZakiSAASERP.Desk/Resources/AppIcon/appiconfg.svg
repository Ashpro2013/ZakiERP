<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Gradients for Zaki ERP -->
    <linearGradient id="gradCyanTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="gradIndigoViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <linearGradient id="gradNeonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="gradCoreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>


  </defs>

  <g transform="translate(0, 0)">
    <!-- Squircle Frame Rim -->
    <rect x="76" y="76" width="360" height="360" rx="80" 
          fill="#0D1322" 
          stroke="url(#gradNeonRim)" 
          stroke-width="5" 
          opacity="0.95" />

    <!-- Inner ambient shadow backing -->
    <rect x="88" y="88" width="336" height="336" rx="68" 
          fill="#111827" 
          opacity="0.8" />

    <!-- 3D Extrusion Shadow Layer for 'Z' -->
    <path d="M 148 196 L 336 196 L 312 236 L 232 324 L 364 324 L 340 364 L 148 364 L 176 324 L 260 236 L 148 236 Z"
          fill="#060913" 
          opacity="0.6" 
          transform="translate(8, 12)" />

    <!-- Base 3D Facet Extrusion (Deep Indigo) -->
    <path d="M 144 190 L 336 190 L 312 232 L 236 322 L 368 322 L 344 360 L 144 360 L 172 322 L 254 232 L 144 232 Z"
          fill="url(#gradIndigoViolet)" />

    <!-- Top Horizontal Bar of 'Z' (Electric Cyan/Teal with Glass Highlight) -->
    <polygon points="144,190 336,190 300,232 172,232" 
             fill="url(#gradCyanTeal)" />
    <polygon points="144,190 336,190 318,206 158,206" 
             fill="url(#glassFacet)" />

    <!-- Diagonal Beam of 'Z' (Multi-layer Prism with Depth) -->
    <polygon points="300,232 336,190 236,322 172,322" 
             fill="url(#gradIndigoViolet)" />
    <polygon points="274,232 300,232 208,322 184,322" 
             fill="url(#gradCoreGlow)" 
             />

    <!-- Bottom Horizontal Bar of 'Z' (Foundational Tech Bar) -->
    <polygon points="172,322 368,322 336,360 144,360" 
             fill="url(#gradCyanTeal)" />
    <polygon points="172,322 368,322 352,336 160,336" 
             fill="url(#glassFacet)" />

    <!-- Left Vertical Cap of Top Bar -->
    <polygon points="144,190 172,232 144,232" 
             fill="#2563EB" />

    <!-- Right Vertical Cap of Bottom Bar -->
    <polygon points="368,322 344,360 368,360" 
             fill="#0284C7" />

    <!-- Sleek Diagonal Speed Grooves (ERP Velocity) -->
    <line x1="288" y1="216" x2="220" y2="304" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <line x1="306" y1="210" x2="242" y2="294" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Vertex Tech Nodes / Accent Points -->
    <circle cx="144" cy="190" r="5" fill="#38BDF8" />
    <circle cx="336" cy="190" r="6" fill="#A855F7" />
    <circle cx="368" cy="322" r="6" fill="#34D399" />
    <circle cx="144" cy="360" r="5" fill="#38BDF8" />
  </g>
</svg>